# new-api二开项目 Docker Compose 配置
#
# 快速部署：
#   1. 修改下方数据库和 Redis 密码（⚠️ 生产环境必须改！）
#   2. docker compose up -d
#   3. 访问 http://localhost:3000
#
# 首次拉取镜像需登录 GitHub Container Registry：
#   echo $GITHUB_TOKEN | docker login ghcr.io -u Le-112K --password-stdin

services:
  new-api:
    image: ghcr.io/le-112k/new-api-lite:latest
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://root:CHANGE_ME_PASSWORD@postgres:5432/new-api
      - REDIS_CONN_STRING=redis://:CHANGE_ME_REDIS@redis:6379
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=new-api-node-1
    depends_on:
      - redis
      - postgres
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "CHANGE_ME_REDIS"]
    networks:
      - new-api-network

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: CHANGE_ME_PASSWORD
      POSTGRES_DB: new-api
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - new-api-network

volumes:
  pg_data:

networks:
  new-api-network:
    driver: bridge

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>new-api-lite 功能取舍清单</title>
<style>
  :root{
    --bg:#fbfbfa; --card:#fff; --fg:#1a1a19; --muted:#6b6b68; --muted2:#8f8f8a;
    --line:#e8e7e3; --line2:#f0efeb; --accent:#1a1a19; --soft:#f4f3f0;
    --ok:#0e6b3c; --ok-bg:#e4f3ea; --warn:#8a4700; --warn-bg:#fbedd9;
    --bad:#a81a1a; --bad-bg:#fbe7e7; --info:#0b5aa8; --info-bg:#e4eefa;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--fg);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}
  header.top{
    position:sticky;top:0;z-index:20;background:rgba(251,251,250,.92);
    backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);
  }
  .top-inner{max-width:1180px;margin:0 auto;padding:14px 20px 12px}
  .top-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  h1{font-size:17px;font-weight:650;margin:0;letter-spacing:-.01em}
  .sub{font-size:12.5px;color:var(--muted)}
  .counters{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .pill{
    display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;
    border:1px solid var(--line);border-radius:999px;background:var(--card);
    font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;
  }
  .pill b{color:var(--fg);font-weight:600}
  .pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .pill.on b{color:#fff}
  .bar{height:3px;background:var(--line2);border-radius:99px;margin-top:10px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);transition:width .18s ease}

  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:18px 0 6px}
  .chip{
    height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);
    background:var(--card);color:var(--muted);font-size:12.5px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;
  }
  .chip:hover{color:var(--fg)}
  .chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .sp{flex:1}
  .btn{
    height:30px;padding:0 12px;border-radius:9px;border:1px solid var(--line);
    background:var(--card);color:var(--fg);font-size:12.5px;cursor:pointer;
  }
  .btn:hover{background:var(--soft)}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .search{
    height:30px;min-width:210px;padding:0 11px;border:1px solid var(--line);
    border-radius:9px;background:var(--card);font:12.5px/1 inherit;color:var(--fg);
  }
  .search:focus{outline:none;border-color:#c9c8c2;background:#fff}

  /* ---- 分块浏览 ---- */
  .layout{display:grid;grid-template-columns:206px minmax(0,1fr);gap:26px;margin-top:20px}
  .rail{position:sticky;top:118px;align-self:start;display:flex;flex-direction:column;gap:2px}
  .rail a{
    display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;
    color:var(--muted);font-size:12.5px;text-decoration:none;cursor:pointer;
  }
  .rail a:hover{background:var(--soft);color:var(--fg)}
  .rail a.on{background:var(--accent);color:#fff}
  .rail a .num{width:16px;text-align:center;opacity:.55;font-size:11px}
  .rail a .n{margin-left:auto;font-size:11px;font-variant-numeric:tabular-nums;opacity:.65}
  .rail a.on .n{opacity:.85}
  .pane-head{padding:0 2px 12px;border-bottom:1px solid var(--line)}
  .ph-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .pane-head h2{margin:0;font-size:15px;font-weight:650;letter-spacing:-.01em}
  .pane-head .note{font-size:12px;color:var(--muted2)}
  .pane-head .stat{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .pane-head .stat b{color:var(--fg)}
  .codeof{
    margin-top:8px;font-size:11.5px;color:var(--muted2);
    display:flex;gap:8px;align-items:flex-start;
  }
  .codeof em{
    font-style:normal;background:var(--soft);border-radius:5px;padding:3px 7px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    color:#5c5c58;word-break:break-all;
  }
  .item{cursor:default}
  .item .body{cursor:pointer}
  .item .lines{display:none}
  .item.expanded .lines{display:grid}
  .item .more{font-size:11px;color:var(--muted2);margin-left:2px}
  .pane-foot{
    display:flex;align-items:center;gap:10px;margin-top:20px;padding-top:14px;
    border-top:1px solid var(--line);
  }
  .pane-foot .hint{font-size:12px;color:var(--muted2)}
  @media (max-width:900px){
    .layout{grid-template-columns:1fr;gap:14px}
    .rail{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}
    .rail a{white-space:nowrap}
    .rail a .n{display:none}
  }

  section.grp{margin-top:26px}
  .grp-head{display:flex;align-items:baseline;gap:10px;padding:0 2px 8px;border-bottom:1px solid var(--line)}
  .grp-head h2{font-size:14px;font-weight:650;margin:0;letter-spacing:-.005em}
  .grp-head .note{font-size:12px;color:var(--muted2)}
  .grp-head .stat{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .grp-head .stat b{color:var(--fg)}

  .item{
    display:grid;grid-template-columns:26px minmax(0,1fr) 88px 76px;
    gap:12px;align-items:start;padding:13px 6px;border-bottom:1px solid var(--line2);
  }
  .item:last-child{border-bottom:0}
  .item:hover{background:#fdfcfa}
  .item.dropped{opacity:.55}
  input[type=checkbox]{
    appearance:none;width:17px;height:17px;margin:2px 0 0;border:1.5px solid #c9c8c2;
    border-radius:5px;background:#fff;cursor:pointer;position:relative;flex-shrink:0;
  }
  input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
  input[type=checkbox]:checked::after{
    content:"";position:absolute;left:5px;top:1.5px;width:4px;height:9px;
    border:2px solid #fff;border-top:0;border-left:0;transform:rotate(42deg);
  }
  input[type=checkbox]:disabled{cursor:not-allowed;opacity:.75}
  .name{font-weight:560;font-size:13.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .code{font:11px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    color:var(--muted2);background:var(--soft);padding:3px 5px;border-radius:4px}
  .desc{color:var(--muted);font-size:12.5px;margin-top:4px}
  .lines{margin-top:6px;display:grid;gap:2px}
  .ln{font-size:12px;color:var(--muted);display:flex;gap:6px}
  .ln .k{color:var(--muted2);flex-shrink:0;width:28px}
  .ln.eg .v{color:#3c3c39}
  .ln.im .v{color:var(--bad)}
  .lv{font-size:11px;padding:3px 7px;border-radius:999px;text-align:center;white-space:nowrap;margin-top:2px}
  .lv.P0{background:var(--bad-bg);color:var(--bad)}
  .lv.P1{background:var(--ok-bg);color:var(--ok)}
  .lv.P2{background:var(--info-bg);color:var(--info)}
  .lv.P3{background:var(--soft);color:var(--muted)}
  .adv{font-size:11.5px;color:var(--muted);text-align:right;margin-top:3px;white-space:nowrap}

  .summary{margin-top:34px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);overflow:hidden}
  .summary h3{margin:0;padding:14px 16px;font-size:13.5px;border-bottom:1px solid var(--line)}
  .sum-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line2)}
  .sum-cell{background:var(--card);padding:12px 16px}
  .sum-cell .k{font-size:11.5px;color:var(--muted2)}
  .sum-cell .v{font-size:19px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
  .out{padding:14px 16px;border-top:1px solid var(--line)}
  textarea{
    width:100%;min-height:120px;resize:vertical;border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;color:var(--fg);background:#fdfcfa;
  }
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);opacity:0;pointer-events:none;
    background:var(--accent);color:#fff;padding:9px 16px;border-radius:999px;font-size:12.5px;
    transition:all .2s ease;z-index:50;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media (max-width:720px){
    .item{grid-template-columns:24px minmax(0,1fr);gap:10px}
    .lv,.adv{grid-column:2;text-align:left}
    .adv{margin-top:-4px}
  }
  @media print{
    header.top{position:static;backdrop:none}
    .toolbar,.out,.toast{display:none}
    body{background:#fff}
    .item{break-inside:avoid}
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="top-row">
      <h1>new-api-lite 功能取舍清单</h1>
      <span class="sub">勾选你需要的；带 🔒 的是主链路，关掉产品不成立</span>
    </div>
    <div class="counters" id="counters"></div>
    <div class="bar"><i id="prog" style="width:0%"></i></div>
  </div>
</header>

<div class="wrap">
  <div class="toolbar">
    <button class="chip" id="btnOnlyUnchecked" aria-pressed="false">只看未选</button>
    <input id="q" class="search" placeholder="在当前的版块里搜索功能名 / 键名" />
    <span class="sp"></span>
    <button class="btn" id="btnDefault">恢复默认</button>
    <button class="btn" id="btnPage">导出本页</button>
    <button class="btn primary" id="btnExport">导出结果</button>
  </div>

  <div class="layout">
    <aside class="rail" id="rail"></aside>
    <main style="min-width:0">
      <div class="pane-head" id="paneHead"></div>
      <div id="groups"></div>
      <div class="pane-foot" id="paneFoot"></div>
    </main>
  </div>

  <div class="summary" id="summary">
    <h3>统计与导出</h3>
    <div class="sum-grid" id="sumGrid"></div>
    <div class="out">
      <textarea id="out" readonly placeholder="点「导出结果」生成勾选摘要"></textarea>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ 数据：每一项都可勾选 ============ */
const GROUPS = [
  { id:'today',    title:'① 今日', note:'每天打开后台的第一屏', code:'features/dashboard/ · controller/usedata.go · controller/perf_metrics.go' },
  { id:'upstream', title:'② 上游', note:'接谁、谁还活着、能用哪些模型', code:'features/channels/ · controller/channel*.go · model/channel.go · router/channel-router.go' },
  { id:'model',    title:'③ 模型与价格', note:'开放什么、给谁用、多少钱', code:'features/models/ · features/model-pricing/ · setting/ratio_setting/ · controller/model*.go' },
  { id:'mine',     title:'④ 我的', note:'用户自己看得到的三页', code:'features/keys/ · features/usage-logs/ · features/wallet/ · features/security/ · controller/token.go · log.go' },
  { id:'users',    title:'⑤ 用户管理', note:'发额度、封禁、分组', code:'features/users/ · controller/user.go · model/user.go' },

  { id:'site',     title:'⑦ 公开站', note:'对外长什么样', code:'features/home/ · pricing/ · about/ · legal/ · controller/misc.go' },
  { id:'proto',    title:'⑧ 协议与端点', note:'不占页面，但决定哪些客户端能接', code:'relay/channel/ · router/relay-router.go · relaykit/' }
]

const ITEMS = [
  /* ---------- 一、接入与转发 ---------- */
  { g:'relay', n:'渠道管理', k:'channels', lv:'P0', lock:true, d:'增删改上游：地址、密钥、模型、分组', e:'新建「火山方舟」：base_url + key + 8 个模型', i:'关掉则无法接入任何上游' },
  { g:'relay', n:'渠道连通性测试', k:'channel-test', lv:'P0', lock:true, d:'保存前先验证能不能通、延迟多少', e:'点「测试」返回 200 / 820ms', i:'不测就上线，故障要等用户报' },
  { g:'relay', n:'从上游拉模型清单', k:'upstream_update', lv:'P1', d:'读上游 /v1/models 并与本地比对，找出新增与下线', e:'点「获取模型」列出 21 个，其中 3 个是新的', i:'不选则模型名靠手抄，写错一个就是 404' },
  { g:'relay', n:'多渠道调度', k:'priority / weight', lv:'P0', lock:true, d:'同一模型挂多个上游时按顺位与权重挑一个', e:'deepseek 挂 2 家：主用 A，A 挂了走 B', i:'关掉则只能一个模型对一家，没有容错' },
  { g:'relay', n:'失败自动下线 + 自动恢复', k:'auto_ban', lv:'P1', d:'连续失败达阈值先摘掉，过一会自动探测恢复', e:'5 次失败下线，60 秒后探测成功自动回', i:'不选则坏渠道持续吃请求，用户看到大量 5xx' },
  { g:'relay', n:'单渠道多 Key', k:'multi-key', lv:'P2', d:'一个上游挂多个 key，轮询或失败切换', e:'同一厂商 5 个免费账号轮流用', i:'不选则每个账号要单独建一条渠道，管理翻倍' },
  { g:'relay', n:'渠道亲和', k:'affinity', lv:'P2', d:'同一会话固定走同一上游，保住上下文缓存', e:'连续 10 轮对话都在 A 家，缓存命中', i:'不选则多上游同模型时可能上下文错乱' },

  { g:'relay', n:'状态码映射', k:'status_code_mapping', lv:'P2', d:'把上游错误码翻译成标准码', e:'上游返回 400+quota → 统一成 429', i:'不选则客户端无法区分「配额用完」和「参数错」' },

  { g:'proto', n:'传统补全', k:'/v1/completions', lv:'P2', d:'老式文本补全，非对话', e:'少数脚本和旧工具还在用', i:'不选则这类客户端报 404' },

  { g:'proto', n:'实时语音', k:'/v1/realtime', lv:'P2', d:'双向音频流', e:'语音助手实时对话', i:'不选则无实时语音' },

const SEC_ORDER = [

  '安全与限制',
  '运维 · 任务', '运维 · 通知', '运维 · 其他'
]

const ADVICE = { P0:'必选', P1:'建议保留', P2:'看需求', P3:'建议移除' }
const KEY = 'newapi-lite-checklist-v1'

/* ============ 状态 ============ */
let state = {}
try { state = JSON.parse(localStorage.getItem(KEY) || '{}') } catch (e) { state = {} }
let filter = 'all'
let query = ''
let step = 0

const idOf = (it) => it.g + ':' + it.n
const isChecked = (it) => {
  const v = state[idOf(it)]
  if (v !== undefined) return v
  if (typeof it.pick === 'boolean') return it.pick
  return it.lv !== 'P2' && it.lv !== 'P3'
}

/* ============ 渲染 ============ */
function render () {
  const hit = (it) => {
    if (filter === 'unselected' && isChecked(it)) return false
    if (!query) return true
    const hay = (it.n + ' ' + it.k + ' ' + it.d + ' ' + it.e).toLowerCase()
    return hay.includes(query)
  }

  // 左侧页面导航
  renderRail()

  const g = GROUPS[step]
  const all = ITEMS.filter((it) => it.g === g.id)
  const list = all.filter(hit)

  document.getElementById('paneHead').innerHTML =
    `<div class="ph-row">
       <h2>${g.title}</h2><span class="note">${g.note}</span>
       <span class="stat">本页已选 <b>${all.filter(isChecked).length}</b> / ${all.length}</span>
     </div>
     <div class="codeof"><span>要改的代码</span><em>${g.code}</em></div>`

  document.getElementById('groups').innerHTML = list.length
    ? list.map(row).join('')
    : '<p style="color:var(--muted2);padding:24px 2px">这一页里没有匹配项</p>'

  document.getElementById('paneFoot').innerHTML =
    `<button class="btn" data-nav="-1" ${step === 0 ? 'disabled' : ''}>← 上一页</button>
     <button class="btn primary" data-nav="1" ${step === GROUPS.length - 1 ? 'disabled' : ''}>下一页 →</button>
     <span class="hint">第 ${step + 1} / ${GROUPS.length} 页 · 点条目展开示例与影响</span>`

  bind()
  stats()
}

function row (it) {
  const on = isChecked(it)
  return `<div class="item ${on ? '' : 'dropped'}" data-row="${idOf(it)}">
    <input type="checkbox" data-id="${idOf(it)}" ${on ? 'checked' : ''} ${it.lock ? 'disabled' : ''}>
    <div class="body">
      <div class="name">${it.n}<span class="code">${it.k}</span><span class="more">展开 ▾</span></div>
      <div class="desc">${it.d}</div>
      <div class="lines">
        <div class="ln eg"><span class="k">示例</span><span class="v">${it.e}</span></div>
        <div class="ln im"><span class="k">影响</span><span class="v">${it.i}</span></div>
      </div>
    </div>
    <div class="lv ${it.lv}">${it.lv}</div>
    <div class="adv">${it.lock ? '🔒 主链路' : ADVICE[it.lv]}</div>
  </div>`
}

function bind () {
  document.querySelectorAll('input[data-id]').forEach((el) => {
    el.addEventListener('change', () => {
      state[el.getAttribute('data-id')] = el.checked
      localStorage.setItem(KEY, JSON.stringify(state))
      el.closest('.item').classList.toggle('dropped', !el.checked)
      const g = GROUPS[step]
      const all = ITEMS.filter((it) => it.g === g.id)
      document.querySelector('#paneHead .stat').innerHTML =
        `本页已选 <b>${all.filter(isChecked).length}</b> / ${all.length}`
      renderRail()
      stats()
    })
  })
  document.querySelectorAll('.item .body').forEach((b) => {
    b.addEventListener('click', () => {
      const item = b.closest('.item')
      item.classList.toggle('expanded')
      b.querySelector('.more').textContent = item.classList.contains('expanded') ? '收起 ▴' : '展开 ▾'
    })
  })
}

function renderRail () {
  document.getElementById('rail').innerHTML = GROUPS.map((g, i) => {
    const all = ITEMS.filter((it) => it.g === g.id)
    const p = all.filter(isChecked).length
    return `<a class="${i === step ? 'on' : ''}" data-step="${i}">
      <span class="num">${i + 1}</span>
      <span>${g.title.replace(/^[①②③④⑤⑥⑦⑧]\s*/, '')}</span>
      <span class="n">${p === all.length ? '✓' : p + '/' + all.length}</span>
    </a>`
  }).join('')
}

/* ============ 统计 ============ */
function stats () {
  const total = ITEMS.length
  const picked = ITEMS.filter(isChecked).length
  const p3 = ITEMS.filter((it) => it.lv === 'P3' && isChecked(it)).length
  const doneGroups = GROUPS.filter((g) => {
    const all = ITEMS.filter((it) => it.g === g.id)
    return all.every(isChecked)
  }).length
  document.getElementById('counters').innerHTML = `
    <span class="pill on">已选 <b>${picked}</b> / ${total}</span>
    <span class="pill">整页选齐 <b>${doneGroups}</b> / ${GROUPS.length} 组</span>
    <span class="pill">建议移除但被勾选 <b>${p3}</b></span>`
  document.getElementById('prog').style.width = (picked / total * 100).toFixed(1) + '%'

  document.getElementById('sumGrid').innerHTML = GROUPS.map((g) => {
    const all = ITEMS.filter((it) => it.g === g.id)
    return `<div class="sum-cell"><div class="k">${g.title.replace(/^[①②③④⑤⑥⑦⑧]\s*/, '')}</div>
      <div class="v">${all.filter(isChecked).length} <span style="font-size:12px;color:var(--muted2)">/ ${all.length}</span></div></div>`
  }).join('')
}

/* ============ 导出 ============ */
function exportText () {
  const lines = ['new-api-lite 功能取舍结果 · ' + new Date().toLocaleDateString('zh-CN'), '']
  GROUPS.forEach((g) => {
    const all = ITEMS.filter((it) => it.g === g.id)
    lines.push(`【${g.title}】 选 ${all.filter(isChecked).length}/${all.length}`)
    all.forEach((it) => {
      lines.push(`  ${isChecked(it) ? '[x]' : '[ ]'} ${it.n} (${it.k}) · ${it.lv} ${ADVICE[it.lv]}`)
    })
    lines.push('')
  })
  const drop = ITEMS.filter((it) => !isChecked(it))
  lines.push(`合计：选 ${ITEMS.length - drop.length} 项 / 共 ${ITEMS.length} 项`)
  lines.push(`不选：${drop.map((it) => it.n).join('、') || '无'}`)
  return lines.join('\n')
}

function toast (msg) {
  const t = document.getElementById('toast')
  t.textContent = msg
  t.classList.add('show')
  clearTimeout(t._h)
  t._h = setTimeout(() => t.classList.remove('show'), 1800)
}

/* ============ 导出单页：生成一份独立文件 ============ */
function esc (s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
}

function buildPageDoc (g, list) {
  const item = (it) => {
    const id = idOf(it)
    return '<div class="item">' +
      '<input type="checkbox" data-id="' + esc(id) + '"' +
        (isChecked(it) ? ' checked' : '') + (it.lock ? ' disabled' : '') + '>' +
      '<div class="bd">' +
        '<div class="nm">' + esc(it.n) + '<code>' + esc(it.k) + '</code>' +
          '<span class="lv ' + it.lv + '">' + it.lv + ' · ' +
          (it.lock ? '主链路' : ADVICE[it.lv]) + '</span></div>' +
        '<div class="ds">' + esc(it.d) + '</div>' +
        '<div class="eg"><b>示例</b>' + esc(it.e) + '</div>' +
        '<div class="im"><b>影响</b>' + esc(it.i) + '</div>' +
        '<input class="note" data-id="' + esc(id) + '" placeholder="备注：为什么留 / 为什么删">' +
      '</div></div>'
  }

  // 有 sec 的页（设置）按后台真实板块分块，其余页平铺
  let rows = ''
  if (list.some((it) => it.sec)) {
    const order = []
    const bucket = {}
    list.forEach((it) => {
      const s = it.sec || '其他'
      if (!bucket[s]) { bucket[s] = []; order.push(s) }
      bucket[s].push(it)
    })
    rows = order
      .sort((a, b) => {
        const ia = SEC_ORDER.indexOf(a), ib = SEC_ORDER.indexOf(b)
        return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib)
      })
      .map((s) =>
        '<div class="secrow"><span>' + esc(s) + '</span><i>' + bucket[s].length + ' 项</i></div>' +
        bucket[s].map(item).join('\n')
      ).join('\n')
  } else {
    rows = list.map(item).join('\n')
  }

  return '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">' +
    '<meta name="viewport" content="width=device-width,initial-scale=1">' +
    '<title>' + esc(g.title) + ' · 功能取舍</title><style>' +
    ':root{--fg:#1a1a19;--muted:#6b6b68;--muted2:#8f8f8a;--line:#e5e4e0;--soft:#f5f4f1}' +
    '*{box-sizing:border-box}body{margin:0;background:#fbfbfa;color:var(--fg);' +
    'font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}' +
    '.wrap{max-width:860px;margin:0 auto;padding:28px 20px 60px}' +
    'h1{font-size:19px;margin:0 0 4px;letter-spacing:-.01em}' +
    '.sub{color:var(--muted);font-size:12.5px}' +
    '.code{margin:12px 0 6px;font:11.5px ui-monospace,Menlo,Consolas,monospace;color:#5c5c58;' +
    'background:var(--soft);padding:8px 10px;border-radius:8px;word-break:break-all}' +
    '.hint{margin:8px 0 2px;font-size:12.5px;color:#8f8f8a}' +
    '.tip{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:#f2f1ec;color:#5c5c58;' +
    'font-size:12.5px;line-height:1.65}' +
    '.secrow{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 0;' +
    'padding-bottom:7px;border-bottom:1.5px solid #d9d8d2;font-size:12px;font-weight:600;' +
    'letter-spacing:.02em;color:#1a1a19}' +
    '.secrow i{font-style:normal;font-weight:400;color:#8f8f8a}' +
    '.item{display:grid;grid-template-columns:22px 1fr;gap:12px;padding:15px 2px;border-bottom:1px solid var(--line)}' +
    '.item:last-child{border-bottom:0}' +
    '.item.off .nm{color:#a9a9a4}' +
    '.item.off .ds,.item.off .eg,.item.off .im{opacity:.55}' +
    'input[type=checkbox]{width:17px;height:17px;margin:3px 0 0;accent-color:#1a1a19;cursor:pointer}' +
    'input[type=checkbox]:disabled{opacity:.7;cursor:not-allowed}' +
    '.nm{font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}' +
    'code{font:11px ui-monospace,Menlo,monospace;color:var(--muted2);background:var(--soft);padding:2px 5px;border-radius:4px}' +
    '.lv{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--soft);color:var(--muted2);font-weight:500}' +
    '.lv.P0{background:#fbe7e7;color:#a81a1a}.lv.P1{background:#e4f3ea;color:#0e6b3c}.lv.P2{background:#e4eefa;color:#0b5aa8}' +
    '.ds{color:var(--muted);font-size:13px;margin-top:5px}' +
    '.eg,.im{font-size:12.5px;margin-top:4px;color:#3c3c39}' +
    '.eg b,.im b{color:var(--muted2);font-weight:500;margin-right:6px}' +
    '.im{color:#a81a1a}' +
    '.note{width:100%;margin-top:9px;border:1px solid var(--line);border-radius:8px;padding:6px 9px;' +
    'font:12.5px inherit;background:#fff;color:var(--fg)}' +
    '.note:focus{outline:none;border-color:#c9c8c2}' +
    'footer{margin-top:22px;display:flex;gap:10px;align-items:center}' +
    'button{height:32px;padding:0 14px;border-radius:9px;border:1px solid #1a1a19;background:#1a1a19;' +
    'color:#fff;font:13px inherit;cursor:pointer}' +
    'textarea{width:100%;min-height:130px;margin-top:12px;border:1px solid var(--line);border-radius:10px;' +
    'padding:10px;font:12px ui-monospace,Menlo,monospace;color:var(--fg);background:#fff}' +
    '@media print{footer{display:none}body{background:#fff}}' +
    '</style></head><body><div class="wrap">' +
    '<h1>' + esc(g.title) + '</h1>' +
    '<div class="sub">' + esc(g.note) + ' · 共 ' + list.length + ' 项 · 已选 <b id="cnt">' +
      list.filter(isChecked).length + '</b></div>' +
    '<div class="code">要改的代码：' + esc(g.code) + '</div>' +
    '<div class="hint">勾选 = 保留，取消勾选 = 计划移除。带锁的是主链路，动不了。备注会自动保存。</div>' +
    (g.tip ? '<div class="tip">' + esc(g.tip) + '</div>' : '') +
    rows +
    '<footer><button id="copy">生成结果文本</button>' +
    '<span class="sub">勾选与备注存在本机浏览器，与总清单共用一份记录</span></footer>' +
    '<textarea id="out" readonly placeholder="点左侧按钮生成"></textarea>' +
    '</div>' +
    '<script>' +
    'var PAGE=' + JSON.stringify(g.id) + ',KEY="newapi-page-"+PAGE,GS="newapi-lite-checklist-v1";' +
    'function rd(k){try{return localStorage.getItem(k)}catch(e){return null}}' +
    'function wr(k,v){try{localStorage.setItem(k,v)}catch(e){}}' +
    'var gs={};try{gs=JSON.parse(rd(GS)||"{}")||{}}catch(e){gs={}}' +
    'var boxes=[].slice.call(document.querySelectorAll("input[type=checkbox]"));' +
    'function cnt(){document.getElementById("cnt").textContent=' +
      'boxes.filter(function(b){return b.checked}).length}' +
    'boxes.forEach(function(b){var id=b.getAttribute("data-id");' +
    'var v=rd(KEY+":"+id);' +
    'if(v!==null)b.checked=(v==="1");else if(typeof gs[id]==="boolean")b.checked=gs[id];' +
    'b.closest(".item").classList.toggle("off",!b.checked);' +
    'b.addEventListener("change",function(){' +
    'wr(KEY+":"+id,b.checked?"1":"0");gs[id]=b.checked;wr(GS,JSON.stringify(gs));' +
    'b.closest(".item").classList.toggle("off",!b.checked);cnt()})});' +
    'var notes=[].slice.call(document.querySelectorAll(".note"));' +
    'notes.forEach(function(t){var id=t.getAttribute("data-id");' +
    'var v=rd(KEY+":note:"+id);if(v)t.value=v;' +
    't.addEventListener("input",function(){wr(KEY+":note:"+id,t.value)})});' +
    'cnt();' +
    'document.getElementById("copy").addEventListener("click",function(){' +
    'var out=[];' +
    '[].forEach.call(document.querySelector(".wrap").children,function(el){' +
    'if(el.className==="secrow"){out.push("");out.push("## "+el.querySelector("span").textContent);return}' +
    'if(el.className.indexOf("item")<0)return;' +
    'var b=el.querySelector("input[type=checkbox]");' +
    'var id=b.getAttribute("data-id");' +
    'var n=el.querySelector(".nm").firstChild.textContent.trim();' +
    'var lv=el.querySelector(".lv").textContent.split(" ")[0];' +
    'var nt=el.querySelector(".note").value.trim();' +
    'out.push((b.checked?"[x] ":"[ ] ")+n+" · "+lv+(nt?"  // "+nt:""))});' +
    'var t=document.getElementById("out");' +
    't.value="' + esc(g.title) + ' 取舍结果\\n\\n"+out.join("\\n");t.select()});' +
    '<\/script></body></html>'
}

/* ============ 事件 ============ */
document.getElementById('btnOnlyUnchecked').addEventListener('click', (e) => {
  const on = e.currentTarget.getAttribute('aria-pressed') !== 'true'
  e.currentTarget.setAttribute('aria-pressed', String(on))
  filter = on ? 'unselected' : 'all'
  render()
})

document.addEventListener('click', (e) => {
  const nav = e.target.closest('[data-nav]')
  if (nav) {
    step = Math.min(GROUPS.length - 1, Math.max(0, step + Number(nav.getAttribute('data-nav'))))
    document.getElementById('q').value = ''
    query = ''
    render()
    window.scrollTo({ top: 0, behavior: 'smooth' })
    return
  }
  const rail = e.target.closest('[data-step]')
  if (rail) {
    step = Number(rail.getAttribute('data-step'))
    document.getElementById('q').value = ''
    query = ''
    render()
    window.scrollTo({ top: 0, behavior: 'smooth' })
  }
})

document.getElementById('q').addEventListener('input', (e) => {
  query = e.target.value.trim().toLowerCase()
  render()
})

document.getElementById('btnDefault').addEventListener('click', () => {
  state = {}
  localStorage.removeItem(KEY)
  render()
  toast('已恢复默认勾选')
})

document.getElementById('btnPage').addEventListener('click', () => {
  const g = GROUPS[step]
  const list = ITEMS.filter((it) => it.g === g.id)
  const html = buildPageDoc(g, list)
  const name = g.title.replace(/^[①②③④⑤⑥⑦⑧]\s*/, '') + '.html'
  const blob = new Blob([html], { type: 'text/html;charset=utf-8' })
  const a = document.createElement('a')
  a.href = URL.createObjectURL(blob)
  a.download = '取舍-' + name
  document.body.appendChild(a)
  a.click()
  a.remove()
  setTimeout(() => URL.revokeObjectURL(a.href), 1000)
  toast('已导出「' + g.title.replace(/^[①②③④⑤⑥⑦⑧]\s*/, '') + '」单页')
})

document.getElementById('btnExport').addEventListener('click', () => {
  const text = exportText()
  document.getElementById('out').value = text
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(
    () => toast('已复制到剪贴板'),
    () => toast('已生成，请手动复制')
  ).catch(() => toast('已生成，请手动复制'))
  document.getElementById('summary').scrollIntoView({ behavior: 'smooth' })
})

render()
</script>
</body>
</html>

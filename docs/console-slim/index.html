<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>new-api 控制台 · 精简版（13 页 → 8 页）</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>

<!-- 演示控制条：切换角色与主题，不属于设计本身 -->
<div class="demo-bar">
  <span class="t">精简版 · 13 页 → 8 页 / 导航 13 → 8 项</span>
  <button data-role="user">普通用户</button>
  <button data-role="admin">管理员</button>
  <button data-role="root">超级管理员</button>
  <span style="width:1px;height:16px;background:var(--border);margin:0 6px"></span>
  <button id="themeBtn">深色</button>
  <span class="sp" id="hint"></span>
</div>

<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">N</span><b>new-api</b></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <button class="user-chip" id="userChip">
        <span class="avatar" id="avatar">B</span>
        <div><b id="userName">bob</b><small id="userRole">普通用户</small></div>
      </button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="hamburger" id="navBtn" aria-label="打开导航">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg>
      </button>
      <div class="crumb"><span id="crumbSec">控制台</span><span>/</span><b id="crumbCur">数据看板</b></div>
      <div class="topbar-right">
        <button class="icon-btn" title="搜索" aria-label="搜索">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m15.6 15.6 4.4 4.4"/></svg>
        </button>
        <button class="icon-btn" title="帮助" aria-label="帮助">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.4"/><path d="M9.7 9.6a2.4 2.4 0 1 1 3.5 2.2c-.8.5-1.2 1-1.2 1.9"/><path d="M12 17.1h.01"/></svg>
        </button>
        <button class="icon-btn" title="全屏" aria-label="全屏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 4.5H5.5a1 1 0 0 0-1 1v4"/><path d="M14.5 4.5h4a1 1 0 0 1 1 1v4"/><path d="M19.5 14.5v4a1 1 0 0 1-1 1h-4"/><path d="M4.5 14.5v4a1 1 0 0 0 1 1h4"/></svg>
        </button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="nav-veil" id="navVeil"></div>
<div class="scrim" id="scrim"><aside class="drawer" id="drawer"></aside></div>
<div class="toast" id="toast"></div>

<script src="./app.js"></script>
</body>
</html>
